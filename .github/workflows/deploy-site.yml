name: Deploy site

# Builds the static site in web/ with the latest data and publishes it to GitHub Pages.
# Runs when the site or scoring code changes on main, and after each data refresh.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "grantmatch/export_web.py"
      - "grantmatch/display.py"
      - "grantmatch/embed.py"
      - "grantmatch/changes.py"
      - ".github/workflows/deploy-site.yml"
  workflow_run:
    workflows: ["Refresh grant data", "Refresh Florida programs", "Refresh foundations", "Refresh funder websites"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Background scoring for ETO (Phase 3E): only whether the key is set. The secrets themselves go to that one step.
      HAS_ETO_KEY: ${{ secrets.ETO_GRANT_MATCHER_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Export the latest data for the browser
        run: python -m grantmatch.export_web web/public/data
      - name: Note deadline and status changes since the last build
        # Public data only. ETO's CRM reads data/changes.json to flag grants it is pursuing (Phase 3).
        run: python -m grantmatch.changes web/public/data --previous https://rendellrich.github.io/grant-matcher/data/changes.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run model
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Score ETO's saved profile
        # Reads ETO's saved grant profile with the Grant Matcher key, ranks it with the page's own code on the data
        # just exported, and records the strong grants in ETO's CRM. Runs after the site is packaged and writes
        # nothing to it; the log shows counts only. A failure here never stops the deploy.
        if: github.repository == 'RendellRich/grant-matcher' && github.ref == 'refs/heads/main' && env.HAS_ETO_KEY == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: web
        env:
          ETO_SUPABASE_URL: ${{ secrets.ETO_SUPABASE_URL }}
          ETO_PUBLISHABLE_KEY: ${{ secrets.ETO_PUBLISHABLE_KEY }}
          ETO_GRANT_MATCHER_KEY: ${{ secrets.ETO_GRANT_MATCHER_KEY }}
        run: npm run score-eto

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
