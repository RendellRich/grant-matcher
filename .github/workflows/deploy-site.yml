name: Deploy site

# Builds the static site in web/ and publishes it to GitHub Pages. The grant data itself no longer ships with
# the site: it is exported to export/, uploaded to the private Supabase bucket the search function reads
# (grantmatch/server_data.py), and only the small public files (meta, examples, coverage, changes, counties)
# are copied into the site. Runs when the site or scoring code changes on main, and after each data refresh.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "grantmatch/export_web.py"
      - "grantmatch/display.py"
      - "grantmatch/embed.py"
      - "grantmatch/changes.py"
      - "grantmatch/server_data.py"
      - "grantmatch/corporate.py"
      - "grantmatch/local.py"
      - "grantmatch/skipped.py"
      # Hand-kept lists the build reads: company programs, Florida local entries, review decisions
      - "data/corporate.json"
      - "data/local-FL.json"
      - "data/skip-review.csv"
      - ".github/workflows/deploy-site.yml"
  workflow_run:
    workflows: ["Refresh grant data", "Refresh Florida programs", "Refresh California grants", "Refresh Illinois grants",
                "Refresh Ohio grants", "Refresh Washington grants",
                "Refresh foundations", "Refresh funder websites"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Background scoring for ETO (Phase 3E): only whether the key is set. The secrets themselves go to that one step.
      HAS_ETO_KEY: ${{ secrets.ETO_GRANT_MATCHER_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Export the latest data
        run: python -m grantmatch.export_web export
      - name: Note deadline and status changes since the last build
        # Public data only. ETO's CRM reads data/changes.json to flag grants it is pursuing (Phase 3).
        run: python -m grantmatch.changes export --previous https://rendellrich.github.io/grant-matcher/data/changes.json
      - name: Upload the data to the private bucket
        # The ingest function (supabase/functions/ingest) hands out one upload link per file. Without the two
        # settings the bucket keeps its last upload and the site still works from it.
        if: github.repository == 'RendellRich/grant-matcher' && github.ref == 'refs/heads/main'
        env:
          GM_INGEST_URL: ${{ vars.GM_INGEST_URL }}
          GM_INGEST_TOKEN: ${{ secrets.GM_INGEST_TOKEN }}
        run: |
          python -m grantmatch.server_data slim export
          if [ -n "$GM_INGEST_URL" ] && [ -n "$GM_INGEST_TOKEN" ]; then
            python -m grantmatch.server_data upload export
          else
            echo "::warning::GM_INGEST_URL or GM_INGEST_TOKEN is not set, so the bucket keeps its last upload."
          fi
      - name: Copy the public files into the site
        run: python -m grantmatch.server_data public export web/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.GM_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.GM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run model
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Score ETO's saved profile
        # Reads ETO's saved grant profile with the Grant Matcher key, ranks it with the page's own code on the data
        # just exported, and records the strong grants in ETO's CRM. Runs after the site is packaged and writes
        # nothing to it; the log shows counts only. A failure here never stops the deploy.
        if: github.repository == 'RendellRich/grant-matcher' && github.ref == 'refs/heads/main' && env.HAS_ETO_KEY == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: web
        env:
          ETO_SUPABASE_URL: ${{ secrets.ETO_SUPABASE_URL }}
          ETO_PUBLISHABLE_KEY: ${{ secrets.ETO_PUBLISHABLE_KEY }}
          ETO_GRANT_MATCHER_KEY: ${{ secrets.ETO_GRANT_MATCHER_KEY }}
        run: npm run score-eto -- --data ../export

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
