name: Refresh Illinois grants

# Open Notices of Funding Opportunity from Illinois' Catalog of State Financial Assistance (grantmatch/illinois.py):
# the state's public list of every agency's open grant notices, with each notice's own page for who may apply.

on:
  schedule:
    - cron: "47 14 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read the Illinois list of open notices
        run: python -m grantmatch.illinois --out build/illinois.json.gz --skipped build/skipped-illinois.json.gz
      - name: Build semantic embeddings
        run: python -m grantmatch.embed programs build/illinois.json.gz build/illinois.npz
      - name: Publish as data-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest grant data" --notes "Refreshed automatically."
          gh release upload data-latest build/illinois.json.gz build/illinois.npz build/skipped-illinois.json.gz --clobber
      - name: Keep this schedule from expiring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-illinois.yml/enable"
