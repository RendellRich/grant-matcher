name: Tests

# Runs once per change, not twice: pushes to main run here, and every other branch runs through its pull
# request. Draft pull requests skip the job (work is checked locally first); marking a PR ready runs it once.
# A newer push to the same pull request cancels the older run.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      # The site scores in the browser with a TypeScript port of the Python scorer. Python writes its own
      # scores for the example profiles; the web tests must match them.
      - name: Score the examples in Python for the parity test
        run: python -m grantmatch.export_web web/test-data --local --golden web/test-data/golden.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck and tests
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
