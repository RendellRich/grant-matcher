name: Refresh California grants

# Open and forecasted calls from the California Grants Portal's daily open-data file.

on:
  schedule:
    - cron: "37 13 * * *"   # daily, after the portal's own morning update
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull the California Grants Portal file
        run: python -m grantmatch.california --out build/california.json.gz --skipped build/skipped-california.json.gz
      - name: Build semantic embeddings
        run: python -m grantmatch.embed programs build/california.json.gz build/california.npz
      - name: Publish as data-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest grant data" --notes "Refreshed automatically."
          gh release upload data-latest build/california.json.gz build/california.npz build/skipped-california.json.gz --clobber
      - name: Keep this schedule from expiring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-california.yml/enable"
