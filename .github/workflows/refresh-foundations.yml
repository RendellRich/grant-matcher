name: Refresh foundations

# Private foundations (990-PF) and community foundations, public foundations and United Ways (990
# Schedule I) for every state, from the IRS e-file batches. Three jobs:
#   parse:   read the IRS batches into one file per state (about 10 minutes)
#   embed:   build search vectors in parallel shards, only for foundations whose text changed since
#            the last run (the cache comes from the release), so a monthly run is short
#   publish: put the vectors into one file per state and upload everything to the data-latest release

on:
  schedule:
    - cron: "23 10 3 * *"   # monthly; the IRS posts new 990 batches about once a month
  workflow_dispatch:
    inputs:
      years:
        description: "IRS filing years, comma separated (blank = last year and this year)"
        required: false

permissions:
  contents: write
  actions: write

env:
  SHARDS: 8

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-data.txt
      - name: Parse 990-PF and 990 Schedule I returns from IRS e-file batches
        run: |
          YEARS="${{ github.event.inputs.years }}"
          if [ -z "$YEARS" ]; then YEARS="$(( $(date +%Y) - 1 )),$(date +%Y)"; fi
          python -m grantmatch.foundations --years "$YEARS" --out build/foundations
          python -m grantmatch.community --years "$YEARS" --out build/community
      - uses: actions/upload-artifact@v4
        with:
          name: parsed
          path: build/
          retention-days: 3

  embed:
    needs: parse
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: parsed
          path: build/
      - name: Get last run's vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-latest --pattern foundation-vectors.npz --dir cache || echo "no cache yet; embedding everything"
      - name: Embed this shard's new and changed foundations
        run: |
          python -m grantmatch.embed_states shard build/foundations build/community \
            --cache cache/foundation-vectors.npz --index ${{ matrix.shard }} --count $SHARDS \
            --out parts/part-${{ matrix.shard }}.npz
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: parts/
          retention-days: 3

  publish:
    needs: embed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: parsed
          path: build/
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts/
          merge-multiple: true
      - name: Get last run's vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-latest --pattern foundation-vectors.npz --dir cache || true
      - name: Write one vector file per state
        run: |
          python -m grantmatch.embed_states split build/foundations build/community \
            --cache cache/foundation-vectors.npz --parts parts/*.npz --out-cache upload/foundation-vectors.npz
      - name: Publish as data-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest grant data" --notes "Refreshed automatically."
          for dir in foundations community; do
            for f in build/$dir/*.json.gz; do st=$(basename "$f" .json.gz); cp "$f" "upload/$dir-$st.json.gz"; cp "build/$dir/$st.npz" "upload/$dir-$st.npz"; done
          done
          ls build/foundations/*.json.gz build/community/*.json.gz | xargs -n1 basename | sed 's/.json.gz//' | sort -u \
            | python -c "import json,sys; print(json.dumps([s.strip() for s in sys.stdin if s.strip()]))" > upload/states.json
          echo "states: $(cat upload/states.json)"
          gh release upload data-latest upload/* --clobber

  keep-schedule:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Keep this schedule from expiring
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-foundations.yml/enable"
