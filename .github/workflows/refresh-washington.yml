name: Refresh Washington grants

# Open state-funded listings from FundHubWA, the Washington Department of Commerce's funding portal
# (grantmatch/washington.py), read from the portal's public JSON API.

on:
  schedule:
    - cron: "59 14 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read FundHubWA's open state listings
        run: python -m grantmatch.washington --out build/washington.json.gz --skipped build/skipped-washington.json.gz
      - name: Build semantic embeddings
        run: python -m grantmatch.embed programs build/washington.json.gz build/washington.npz
      - name: Publish as data-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest grant data" --notes "Refreshed automatically."
          gh release upload data-latest build/washington.json.gz build/washington.npz build/skipped-washington.json.gz --clobber
      - name: Keep this schedule from expiring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-washington.yml/enable"
